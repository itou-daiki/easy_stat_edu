<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
    <title id="title">因子分析</title>
    <desc id="desc">多くの質問の背後にある共通テーマを探す</desc>
    <defs>
        
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#f59e0b"/>
        </marker>
        <style>
            .title { font: 700 42px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .subtitle { font: 500 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .panelLabel { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .axisLabel { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .cellText { font: 700 27px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .callout { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .note { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .formula { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #d97706; }
            .bigNum { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .smallNode { font: 800 23px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .word { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: white; }
        </style>
    </defs>
    
        <rect width="1200" height="675" rx="34" fill="#f8fafc"/>
        <circle cx="1060" cy="95" r="96" fill="#7c3aed" opacity="0.08"/>
        <circle cx="108" cy="570" r="118" fill="#0ea5e9" opacity="0.07"/>
        <rect x="54" y="54" width="1092" height="567" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
        <rect x="54" y="54" width="1092" height="10" rx="5" fill="#7c3aed"/>
        <text x="96" y="128" class="title">因子分析</text>
        <text x="96" y="174" class="subtitle">多くの質問の背後にある共通テーマを探す</text>
    
                <circle cx="210" cy="330" r="36" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="210" y="339" class="smallNode" text-anchor="middle">Q1</text><circle cx="320" cy="385" r="36" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="320" y="394" class="smallNode" text-anchor="middle">Q2</text><circle cx="430" cy="440" r="36" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="430" y="449" class="smallNode" text-anchor="middle">Q3</text><circle cx="710" cy="330" r="36" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="710" y="339" class="smallNode" text-anchor="middle">Q4</text><circle cx="820" cy="385" r="36" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="820" y="394" class="smallNode" text-anchor="middle">Q5</text><circle cx="930" cy="440" r="36" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="930" y="449" class="smallNode" text-anchor="middle">Q6</text>
                <ellipse cx="360" cy="405" rx="95" ry="62" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
                <ellipse cx="860" cy="405" rx="95" ry="62" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
                <text x="360" y="413" class="panelLabel" text-anchor="middle">因子1</text>
                <text x="860" y="413" class="panelLabel" text-anchor="middle">因子2</text>
                <text x="600" y="586" class="axisLabel" text-anchor="middle">質問のまとまりから共通テーマを命名</text>
</svg>
