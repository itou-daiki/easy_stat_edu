        <line x1="185" y1="525" x2="1025" y2="525" stroke="#94a3b8" stroke-width="3"/>
        <line x1="185" y1="525" x2="185" y2="260" stroke="#94a3b8" stroke-width="3"/>
                <path d="M 230 505 C 390 500, 470 470, 555 395 C 650 305, 735 260, 965 250" fill="none" stroke="#e11d48" stroke-width="9" stroke-linecap="round"/>
