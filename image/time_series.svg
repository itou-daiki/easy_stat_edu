<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
    <title id="title">時系列データ分析</title>
    <desc id="desc">時間に沿った傾向・周期・変化を見る</desc>
    <defs>
        
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#0ea5e9"/>
        </marker>
        <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#f59e0b"/>
        </marker>
        <style>
            .title { font: 700 42px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .subtitle { font: 500 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .panelLabel { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .axisLabel { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .cellText { font: 700 27px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .callout { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .note { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .formula { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #d97706; }
            .bigNum { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .smallNode { font: 800 23px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .word { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: white; }
        </style>
    </defs>
    
        <rect width="1200" height="675" rx="34" fill="#f8fafc"/>
        <circle cx="1060" cy="95" r="96" fill="#0ea5e9" opacity="0.08"/>
        <circle cx="108" cy="570" r="118" fill="#0ea5e9" opacity="0.07"/>
        <rect x="54" y="54" width="1092" height="567" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
        <rect x="54" y="54" width="1092" height="10" rx="5" fill="#0ea5e9"/>
        <text x="96" y="128" class="title">時系列データ分析</text>
        <text x="96" y="174" class="subtitle">時間に沿った傾向・周期・変化を見る</text>
    
                
        <line x1="185" y1="525" x2="1025" y2="525" stroke="#94a3b8" stroke-width="3"/>
        <line x1="185" y1="525" x2="185" y2="260" stroke="#94a3b8" stroke-width="3"/>
                <path d="M 240 450 C 330 390, 400 435, 480 360 S 655 310, 740 350 S 870 300, 970 245" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
                <path d="M 240 500 L 970 265" stroke="#334155" stroke-width="5" stroke-dasharray="18 14"/>
                <text x="760" y="235" class="callout">トレンド</text>
                <text x="600" y="586" class="axisLabel" text-anchor="middle">時間順に並べて変化と周期を確認</text>
</svg>
