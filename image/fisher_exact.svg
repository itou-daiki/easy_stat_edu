<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
    <title id="title">フィッシャーの正確確率検定</title>
    <desc id="desc">少人数の2×2表を正確に検定する</desc>
    <defs>
        
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#f59e0b"/>
        </marker>
        <style>
            .title { font: 700 42px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .subtitle { font: 500 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .panelLabel { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .axisLabel { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .cellText { font: 700 27px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .callout { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .note { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .formula { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #d97706; }
            .bigNum { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .smallNode { font: 800 23px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .word { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: white; }
        </style>
    </defs>
    
        <rect width="1200" height="675" rx="34" fill="#f8fafc"/>
        <circle cx="1060" cy="95" r="96" fill="#7c3aed" opacity="0.08"/>
        <circle cx="108" cy="570" r="118" fill="#0ea5e9" opacity="0.07"/>
        <rect x="54" y="54" width="1092" height="567" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
        <rect x="54" y="54" width="1092" height="10" rx="5" fill="#7c3aed"/>
        <text x="96" y="128" class="title">フィッシャーの正確確率検定</text>
        <text x="96" y="174" class="subtitle">少人数の2×2表を正確に検定する</text>
    <rect x="250" y="265" width="230" height="86" fill="#eef2ff" stroke="#cbd5e1" stroke-width="2"/><text x="365" y="318" class="panelLabel" text-anchor="middle"></text><rect x="480" y="265" width="230" height="86" fill="#eef2ff" stroke="#cbd5e1" stroke-width="2"/><text x="595" y="318" class="panelLabel" text-anchor="middle">あり</text><rect x="710" y="265" width="230" height="86" fill="#eef2ff" stroke="#cbd5e1" stroke-width="2"/><text x="825" y="318" class="panelLabel" text-anchor="middle">なし</text><rect x="250" y="351" width="230" height="86" fill="#eef2ff" stroke="#cbd5e1" stroke-width="2"/><text x="365" y="404" class="panelLabel" text-anchor="middle">群1</text><rect x="480" y="351" width="230" height="86" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="595" y="404" class="cellText" text-anchor="middle">3</text><rect x="710" y="351" width="230" height="86" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="825" y="404" class="cellText" text-anchor="middle">9</text><rect x="250" y="437" width="230" height="86" fill="#eef2ff" stroke="#cbd5e1" stroke-width="2"/><text x="365" y="490" class="panelLabel" text-anchor="middle">群2</text><rect x="480" y="437" width="230" height="86" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="595" y="490" class="cellText" text-anchor="middle">8</text><rect x="710" y="437" width="230" height="86" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="825" y="490" class="cellText" text-anchor="middle">2</text><text x="600" y="586" class="axisLabel" text-anchor="middle">小さい2×2表でも正確にp値を計算</text>
