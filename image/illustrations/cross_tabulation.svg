<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif">
<title>クロス集計：学年によって部活の入り方はちがうか</title>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800.0" y="80.0" font-size="50" font-weight="700" fill="#17202c" text-anchor="middle">学年によって、部活の入り方はちがう？</text>
<text x="800.0" y="124.0" font-size="26" font-weight="400" fill="#17202c" text-anchor="middle">100人の例　学年と部活の2つの項目を組み合わせて、人数を数えます</text>
