<text x="1190.0" y="618.0" font-size="24" font-weight="400" fill="#556070" text-anchor="middle">全体を100%にそろえると、学年どうしを比べやすい</text>
<text x="410.0" y="700.0" font-size="30" font-weight="700" fill="#17202c" text-anchor="middle">3年生は「入っていない」の割合が大きい</text>
