<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif">
<title>マクネマー検定：授業の前と後で、わかると答えた人が増えたのはたしかな変化といえるか</title>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800.0" y="80.0" font-size="49" font-weight="700" fill="#17202c" text-anchor="middle">授業の後に「わかる」が増えたのは、「たしかな変化」といえる？</text>
<text x="800.0" y="124.0" font-size="26" font-weight="400" fill="#17202c" text-anchor="middle">左右は別の例です。どちらも同じ30人に、授業の前と後で同じ質問をしました。点1つが1人</text>
<text x="800.0" y="156.0" font-size="24" font-weight="400" fill="#556070" text-anchor="middle">注目するのは、答えが変わった人（色のついた2つのマス）だけです</text>
<rect x="40.0" y="180.0" width="740.0" height="450.0" rx="0" fill="none" stroke="#d9dde3" stroke-width="3"/>
<text x="66.0" y="228.0" font-size="30" font-weight="700" fill="#17202c" text-anchor="start">「わかる」に変わった人がずっと多い</text>
<text x="470.0" y="263.0" font-size="24" font-weight="700" fill="#556070" text-anchor="middle">授業の後</text>
<text x="355.0" y="301.0" font-size="26" font-weight="700" fill="#17202c" text-anchor="middle">わかる</text>
<text x="585.0" y="301.0" font-size="26" font-weight="700" fill="#17202c" text-anchor="middle">わからない</text>
