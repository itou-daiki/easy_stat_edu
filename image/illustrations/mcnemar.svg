<text x="410.0" y="604.0" font-size="22" font-weight="700" fill="#17202c" text-anchor="middle">わかるに変わった 11人　と　わからないに変わった 1人 を比べる</text>
<text x="410.0" y="670.0" font-size="24" font-weight="400" fill="#556070" text-anchor="middle">マクネマー検定で計算すると…</text>
<text x="410.0" y="712.0" font-size="32" font-weight="700" fill="#17202c" text-anchor="middle">「わかる」が増えたといえる</text>
