<text x="1190.0" y="670.0" font-size="24" font-weight="400" fill="#556070" text-anchor="middle">マクネマー検定で計算すると…</text>
<text x="1190.0" y="712.0" font-size="32" font-weight="700" fill="#17202c" text-anchor="middle">今回のデータでは、変化があるとまではいえない</text>
<text x="1190.0" y="748.0" font-size="24" font-weight="400" fill="#17202c" text-anchor="middle">（「同じ」とわかったわけではありません）</text>
<text x="800.0" y="850.0" font-size="28" font-weight="700" fill="#17202c" text-anchor="middle">マクネマー検定は、同じ人の前と後で答えが変わった人だけに注目して、変化の向きにかたよりがあるかを調べます</text>
