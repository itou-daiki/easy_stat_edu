<title>二要因分散分析：学年と部活の有無を組み合わせると、勉強時間はどう変わるか</title>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800.0" y="80.0" font-size="50" font-weight="700" fill="#17202c" text-anchor="middle">学年と部活の有無を組み合わせると、勉強時間はどう変わる？</text>
<text x="800.0" y="124.0" font-size="26" font-weight="400" fill="#17202c" text-anchor="middle">左右は別の例です。各グループ15人。小さい点が1人、大きい点と線がグループの平均</text>
<text x="800.0" y="156.0" font-size="24" font-weight="400" fill="#556070" text-anchor="middle">青：部活あり　オレンジ：部活なし</text>
