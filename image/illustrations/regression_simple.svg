<text x="1050.0" y="666.0" font-size="24" font-weight="400" fill="#556070" text-anchor="start">　 一人ひとりにはずれがあります</text>
<text x="800.0" y="860.0" font-size="28" font-weight="700" fill="#17202c" text-anchor="middle">単回帰分析は、1つの数値から別の数値を予測する「直線の式」を求める方法です</text>
