<text x="1050.0" y="250.0" font-size="30" font-weight="700" fill="#17202c" text-anchor="start">結果が「合格・不合格」のように</text>
<text x="1050.0" y="292.0" font-size="30" font-weight="700" fill="#17202c" text-anchor="start">2つに分かれるときに使う</text>
<text x="1050.0" y="390.0" font-size="28" font-weight="400" fill="#17202c" text-anchor="start">S字のカーブで、勉強時間ごとの</text>
<text x="1050.0" y="428.0" font-size="28" font-weight="400" fill="#17202c" text-anchor="start">「合格する確率」を表す</text>
<text x="1070.0" y="500.0" font-size="28" font-weight="700" fill="#1670c9" text-anchor="start">1時間 → 約5%</text>
<text x="1070.0" y="560.0" font-size="28" font-weight="700" fill="#1670c9" text-anchor="start">3時間 → 約69%</text>
<text x="1070.0" y="620.0" font-size="28" font-weight="700" fill="#1670c9" text-anchor="start">5時間 → 約99%</text>
<text x="800.0" y="860.0" font-size="28" font-weight="700" fill="#17202c" text-anchor="middle">ロジスティック回帰分析は、2つに分かれる結果（合格・不合格など）が起こる確率を予測する方法です</text>
