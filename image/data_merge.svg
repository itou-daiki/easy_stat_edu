<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
    <title id="title">データ結合</title>
    <desc id="desc">共通IDを目印に、2つの表を1つにまとめる</desc>
    <defs>
        
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#14b8a6"/>
        </marker>
        <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#f59e0b"/>
        </marker>
        <style>
            .title { font: 700 42px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .subtitle { font: 500 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .panelLabel { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .axisLabel { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .cellText { font: 700 27px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .callout { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .note { font: 600 25px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
            .formula { font: 700 26px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #d97706; }
            .bigNum { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .smallNode { font: 800 23px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #17324d; }
            .word { font: 800 28px "Inter", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: white; }
        </style>
    </defs>
    
        <rect width="1200" height="675" rx="34" fill="#f8fafc"/>
        <circle cx="1060" cy="95" r="96" fill="#14b8a6" opacity="0.08"/>
        <circle cx="108" cy="570" r="118" fill="#0ea5e9" opacity="0.07"/>
        <rect x="54" y="54" width="1092" height="567" rx="28" fill="#ffffff" filter="url(#cardShadow)"/>
        <rect x="54" y="54" width="1092" height="10" rx="5" fill="#14b8a6"/>
        <text x="96" y="128" class="title">データ結合</text>
        <text x="96" y="174" class="subtitle">共通IDを目印に、2つの表を1つにまとめる</text>
    
                
        <rect x="120" y="285" width="270" height="185" rx="18" fill="#ecfeff" stroke="#cbd5e1" stroke-width="2"/>
        <text x="255" y="323" class="panelLabel" text-anchor="middle">ファイルA</text>
                
        <rect x="120" y="315" width="270" height="185" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <text x="255" y="353" class="panelLabel" text-anchor="middle">ID・得点・性別</text>
                
        <rect x="810" y="285" width="270" height="185" rx="18" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="2"/>
        <text x="945" y="323" class="panelLabel" text-anchor="middle">結合後データ</text>
                
        <rect x="465" y="250" width="270" height="110" rx="18" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/>
        <text x="600" y="288" class="panelLabel" text-anchor="middle">共通IDで照合</text>
                
        <rect x="465" y="390" width="270" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <text x="600" y="428" class="panelLabel" text-anchor="middle">ファイルB</text>
                <path d="M 390 375 L 465 320" stroke="#14b8a6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
                <path d="M 735 320 L 810 375" stroke="#14b8a6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
                <path d="M 600 390 L 600 360" stroke="#14b8a6" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
                <text x="600" y="548" class="note" text-anchor="middle">行数・重複・結合できなかったIDを確認</text>
</svg>
